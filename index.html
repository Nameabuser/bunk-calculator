<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><meta name="description" content="Bunk Calculator: find out how many classes you can skip and still keep your attendance safe.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bunk"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="icons/1-apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/2-icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Bunk Calculator</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--bd:#243049;--tx:#eef2ff;--mu:#8b97b5;--ok:#2fd27f;--bad:#ff5d6c;--ac:#7c6cff}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(40px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:28px;letter-spacing:-.5px}h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input{width:100%;background:#0e1424;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px;font-size:16px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;background:var(--ac);color:#fff;width:100%;margin-top:12px}
.help{font-size:13px;color:var(--mu);margin:10px 0 0}.cap{display:block;color:var(--mu);font-size:11px;margin-top:6px}.mini button:disabled{opacity:.4}.res{margin-top:12px;padding:12px;border-radius:12px;font-size:15px}
.res b{font-size:24px;line-height:1.3}.of{font-size:17px}.sm{display:block;margin-top:6px;opacity:.85;font-size:13px}
.ok{background:#12301f;color:var(--ok)}.bad{background:#3a1620;color:var(--bad)}
.bar{height:8px;background:#0e1424;border-radius:6px;margin-top:10px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.mark{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.sj{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sj h3{margin:0;font-size:17px}.pct{font-weight:800;font-size:20px}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{margin:0;padding:9px;font-size:14px;background:#1d2740;font-weight:600}
.x{background:none!important;color:var(--mu);width:auto!important;padding:4px 8px!important;margin:0!important}
.empty{color:var(--mu);text-align:center;padding:18px}
footer{color:var(--mu);font-size:12px;text-align:center;margin-top:18px}
</style></head><body>
<h1>Bunk <span>Calculator</span></h1>
<p class="sub">Skip smart, not blind. Everything stays on your phone.</p>
<div class="card">
<div class="row"><div><label for="nm">Subject (optional)</label><input id="nm" placeholder="e.g. Maths" maxlength="30"></div>
<div><label for="rq">Required attendance %</label><input id="rq" type="number" inputmode="numeric" min="1" max="100" value="75"></div></div>
<div class="row" style="margin-top:10px"><div><label for="sm">Total classes in the whole semester</label><input id="sm" type="number" inputmode="numeric" min="1" placeholder="e.g. 60"></div>
<div><label for="hd">Classes held till now (present + absent)</label><input id="hd" type="number" inputmode="numeric" min="0" placeholder="e.g. 38"></div></div>
<div style="margin-top:10px"><label for="at">Classes you attended (present)</label><input id="at" type="number" inputmode="numeric" min="0" placeholder="e.g. 30"></div>
<p class="help">Example: 60 total, 38 done, 30 present.</p>
<button id="go">Calculate</button>
<div id="out"></div>
</div>
<div id="list"></div>
<footer>No sign-up, no tracking, no uploads. Counts are saved only in this browser. Rules differ between colleges, so check your own.</footer>
<script>
function calc(S,H,A,r){
  if(!(S>0)||H<0||A<0||A>H||H>S||r<1||r>100)return null;
  var need=Math.ceil(r*S/100-1e-9),rem=S-H,allowed=S-need,missed=H-A,x=allowed-missed,maxp=(A+rem)/S*100;
  return{S:S,H:H,A:A,r:r,need:need,rem:rem,allowed:allowed,missed:missed,x:x,maxp:maxp,now:H>0?A/H*100:100};
}
function msg(c){
  if(c.rem===0)return '<b>Semester over</b>'+(c.x>=0?': you made it':': below '+c.r+'%');
  if(c.x>0)return '<b>You can bunk '+c.x+' more class'+(c.x>1?'es':'')+'</b> <span class="of">out of the '+c.rem+' left</span>';
  if(c.x===0)return '<b>Attend all '+c.rem+' remaining class'+(c.rem>1?'es':'')+'</b>';
  return '<b>Too late: max '+c.maxp.toFixed(0)+'%</b>';
}
function sub(c){return c.rem===0||c.x>0?'':c.rem+' left'}
function bar(c){var w=c.A/c.S*100,g=c.maxp,k=c.x>=0?'var(--ok)':'var(--bad)';return '<div class="bar"><i style="width:'+g+'%;background:'+k+';opacity:.3;position:absolute"></i><i style="width:'+w+'%;background:'+k+';position:absolute"></i><span class="mark" style="left:'+c.r+'%"></span></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var $=function(i){return document.getElementById(i)};
var S=[];try{S=JSON.parse(localStorage.getItem('bunk2')||'[]')}catch(e){}
function save(){try{localStorage.setItem('bunk2',JSON.stringify(S))}catch(e){}}
function cls(c){return c.x>0?'ok':'bad'}
function show(){
  var s=parseInt($('sm').value),h=parseInt($('hd').value),a=parseInt($('at').value),r=parseFloat($('rq').value),c=calc(s,h,a,r);
  if(!c){$('out').innerHTML='<div class="res bad">Check the numbers: attended cannot be more than held, and held cannot be more than the semester total.</div>';return null}
  $('out').innerHTML='<div class="res '+cls(c)+'">'+msg(c)+'<small class="sm">'+(sub(c)?sub(c)+'. ':'')+c.now.toFixed(1)+'% now, need '+r+'%</small>'+bar(c)+'</div><button id="sv">Save this subject</button>';
  $('sv').onclick=function(){S.push({n:$('nm').value.trim()||'Subject '+(S.length+1),s:s,h:h,a:a,r:r});save();$('out').innerHTML='';$('nm').value='';$('sm').value='';$('hd').value='';$('at').value='';render()};
  return c;
}
function render(){
  if(!S.length){$('list').innerHTML='<div class="empty">Saved subjects show up here.</div>';return}
  $('list').innerHTML=S.map(function(s,i){var c=calc(s.s,s.h,s.a,s.r);
    return '<div class="card"><div class="sj"><h3>'+esc(s.n)+'</h3><span class="pct" style="color:'+(c.x>=0?'var(--ok)':'var(--bad)')+'">'+c.now.toFixed(1)+'%</span><button class="x" data-d="'+i+'" aria-label="Delete">\u2715</button></div>'
    +'<small style="color:var(--mu)">'+s.a+'/'+s.h+' present, '+s.s+' in semester, need '+s.r+'%</small>'+bar(c)
    +'<div class="res '+cls(c)+'">'+msg(c)+(sub(c)?'<small class="sm">'+sub(c)+'</small>':'')+'</div>'
    +'<div class="mini"><button data-p="'+i+'"'+(s.h>=s.s?' disabled':'')+'>Attended today</button><button data-m="'+i+'"'+(s.h>=s.s?' disabled':'')+'>Bunked today</button></div></div>'}).join('');
}
$('go').onclick=show;
$('list').onclick=function(e){var d=e.target.dataset;if(!d)return;
  if(d.d!==undefined){S.splice(+d.d,1)}else if(d.p!==undefined){var s=S[+d.p];if(s.h>=s.s)return;s.a++;s.h++}else if(d.m!==undefined){var s2=S[+d.m];if(s2.h>=s2.s)return;s2.h++}else return;
  save();render()};
render();
</script></body></html>
